apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app: nginx
spec:
  containers:
    - name: nginx
      image: nginx:stable
      ports:
        - name: http
          containerPort: 80
          protocol: TCP
---
apiVersion: v1
kind: Pod
metadata:
  name: linux-server
  labels:
    app: linux-server
spec:
  containers:
    - name: http-server
      image: python:3.12-alpine
      command: ["python", "-m", "http.server", "8000", "--bind", "0.0.0.0"]
      ports:
        - name: http
          containerPort: 8000
          protocol: TCP
---
apiVersion: v1
kind: Pod
metadata:
  name: linux-client
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: linux-server-service
spec:
  selector:
    app: linux-server
  ports:
    - name: http
      port: 8000
      targetPort: 8000
